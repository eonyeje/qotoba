<!doctype html>
<html lang="en" data-layout="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qotoba Workbench prototype</title>
<meta name="description" content="Clickable prototype of the Qotoba Workbench: inbox, tree, packets, rulings and sessions in phone, Rider and desktop layouts.">
<link rel="stylesheet" href="workbench.css">
</head>
<body>
<!-- The shell is empty on purpose: every screen is drawn by app.js from data.js. -->
<div id="stage">
  <div id="shell">
    <header id="hdr" class="hdr"></header>
    <div class="wb-body">
      <nav id="nav" aria-label="Main"></nav>
      <section id="list" aria-label="List"></section>
      <main id="detail" aria-label="Detail"></main>
    </div>
    <nav id="bottom" aria-label="Main"></nav>
    <div id="layer"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </div>
</div>
<div id="drawer-root"></div>
<noscript>This prototype needs JavaScript.</noscript>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
