<!doctype html>
<html lang="en" data-layout="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qotoba Workbench</title>
<meta name="description" content="The Qotoba Workbench: inbox, tree, packets, rulings and sessions in phone, Rider and desktop layouts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:,">
<script>
  /* every file the page needs is fetched with a fresh stamp, so an embedded browser's cache never shows an old build */
  window.QWB_STAMP = String(Date.now());
  document.write('<link rel="stylesheet" href="workbench.css?v=' + window.QWB_STAMP + '">');
</script>
</head>
<body>
<!-- The shell is empty on purpose: every screen is drawn by app.js from window.WB, which boot.js fetches from the service. -->
<div id="stage">
  <div id="shell">
    <header id="hdr" class="hdr"></header>
    <div class="wb-body">
      <nav id="nav" aria-label="Main"></nav>
      <section id="list" aria-label="List"></section>
      <main id="detail" aria-label="Detail"></main>
    </div>
    <nav id="bottom" aria-label="Main"></nav>
    <div id="layer"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </div>
</div>
<div id="drawer-root"></div>
<noscript>The Workbench needs JavaScript.</noscript>
<script>document.write('<script src="boot.js?v=' + window.QWB_STAMP + '"><\/script>');</script>
</body>
</html>
